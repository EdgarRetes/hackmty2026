services:
  db:
    image: timescale/timescaledb:2.30.0-pg17
    environment:
      POSTGRES_USER: factorai
      POSTGRES_PASSWORD: factorai
      POSTGRES_DB: factorai
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data

  backend:
    build: .
    environment:
      DJANGO_SETTINGS_MODULE: factorai_config.settings.production
      DATABASE_URL: postgresql://factorai@db:5432/factorai
      DB_PASSWORD: factorai
      SECRET_KEY: change-me-in-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  timescale_data:
